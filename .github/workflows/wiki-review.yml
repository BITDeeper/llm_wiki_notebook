name: Wiki Content Review

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"

permissions:
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run wiki review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.event.sha }}
        run: node .github/wiki-review.mjs
